name: release-candidate-ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-candidate-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-gate:
    name: PR Fast Gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/lazy_armor_ci_test
      MYSQL_ADMIN_URL: mysql://root:root@127.0.0.1:3306/mysql
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: test-jwt-secret-that-is-longer-than-thirty-two-characters
      CREDENTIAL_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_ENV: development
      NODE_ENV: test
      APP_ROLE: api
      EXPO_PUBLIC_APP_ENV: development

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repository hygiene
        run: pnpm repository:hygiene
      - name: Current terminology gate
        run: pnpm terminology:check
      - name: Production data truth gate
        run: pnpm data:truth
      - name: Backup and restore target safety regression
        run: pnpm --filter @lazy-armor/database test
      - name: Admin visitor authentication regression
        run: pnpm --filter @lazy-armor/admin test
      - name: Patched dependency runtime regression
        run: pnpm --filter @lazy-armor/api test -- test/dependency-runtime.spec.ts
      - name: Production dependency audit
        run: pnpm audit:dependencies
      - name: Prepare CI database
        run: pnpm --filter @lazy-armor/database prepare-ci-db
      - name: Migration safety gate
        run: pnpm migration:safety
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Verify MySQL 8.4 migration evidence
        run: pnpm db:mysql84-verify
      - name: Full typecheck
        run: pnpm typecheck
      - name: Build internal test dependency entrypoints
        run: pnpm --filter @lazy-armor/api... build
      - name: Focused mobile regression
        run: pnpm --filter @lazy-armor/mobile test
      - name: Unified identity and atomic password reset regression
        run: pnpm --filter @lazy-armor/api test -- test/auth-v2.integration.spec.ts test/login-code.spec.ts test/password-reset-delivery.spec.ts --hookTimeout=90000
      - name: User password credential compatibility regression
        run: pnpm --filter @lazy-armor/api test -- test/auth-password-credentials.integration.spec.ts test/password-credential-startup.spec.ts --hookTimeout=90000
      - name: Safe new email binding regression
        run: pnpm --filter @lazy-armor/api test -- test/email-binding.integration.spec.ts test/email-binding-startup.spec.ts --hookTimeout=90000
      - name: Safe new phone binding regression
        run: pnpm --filter @lazy-armor/api test -- test/phone-binding.integration.spec.ts test/phone-binding-startup.spec.ts --hookTimeout=90000
      - name: Safe phone replacement and durable security notices regression
        run: pnpm --filter @lazy-armor/api test -- test/phone-change.integration.spec.ts --hookTimeout=90000
      - name: Durable SMS budgets and bounded request Redis regression
        run: pnpm --filter @lazy-armor/api test -- test/sms-code-delivery.integration.spec.ts test/sms-code-startup.spec.ts test/request-redis.integration.spec.ts test/runtime-provider-common.integration.spec.ts --hookTimeout=90000
      - name: Durable SMS request anomaly regression
        run: pnpm --filter @lazy-armor/api test -- test/sms-abuse.integration.spec.ts test/sms-abuse-startup.spec.ts --hookTimeout=90000
      - name: Web Passkey real signature and account/session regression
        run: pnpm --filter @lazy-armor/api test -- test/passkey.integration.spec.ts test/passkey-startup.spec.ts --hookTimeout=90000
      - name: Verified email password recovery regression
        run: pnpm --filter @lazy-armor/api test -- test/password-recovery.integration.spec.ts test/password-recovery-token.spec.ts --hookTimeout=90000
      - name: V91 shared goal and delivery contract regression
        run: >-
          pnpm --filter @lazy-armor/plan-schema test --
          test/goal-brief.spec.ts test/goal-experience.spec.ts test/agent-report.spec.ts
          test/report-financial.spec.ts test/consumer-outcome.spec.ts test/consumer-projection.spec.ts
      - name: V91 durable goal authoring regression
        run: >-
          pnpm --filter @lazy-armor/api test --
          test/v91-requirements.spec.ts test/v91-goal-brief-confirmation.spec.ts
          test/authoring-jobs.integration.spec.ts test/v91-goal-promotion.integration.spec.ts
          test/v91-goal-authoring.integration.spec.ts test/goal-experience.spec.ts
          test/v91-authoring-process.integration.spec.ts
          test/v91-report-requirement-context.spec.ts test/report-model.spec.ts test/report-financial-audit.spec.ts test/work-item-generation.spec.ts
      - name: V92 learning and original Memory regression
        run: pnpm --filter @lazy-armor/api test -- test/v92-learning.integration.spec.ts test/v92-report-decisions.integration.spec.ts test/personal-memory.integration.spec.ts test/memory-candidates.integration.spec.ts test/memory-graph.integration.spec.ts test/runtime-verification-reconciliation.integration.spec.ts
      - name: V92 shared learning contract regression
        run: pnpm --filter @lazy-armor/plan-schema test -- test/learning-candidate.spec.ts test/report-decision.spec.ts
      - name: V93 composition preview and original method regression
        run: pnpm --filter @lazy-armor/api test -- test/v93-composition-preview.integration.spec.ts test/skill-repositories.integration.spec.ts
      - name: V93 bounded composition contract regression
        run: pnpm --filter @lazy-armor/plan-schema test -- test/skill-resource-graph.spec.ts test/composition-authoring.spec.ts test/composition-resources.spec.ts
      - name: V93 report method chain and persistent budget regression
        run: >-
          pnpm --filter @lazy-armor/api test --
          test/report-method-state.spec.ts test/report-method-model.spec.ts
          test/v93-composition-authoring.integration.spec.ts test/v93-composition-bindings.integration.spec.ts
          test/public-web-report.integration.spec.ts test/report-budget.spec.ts test/report-final-review-budget.spec.ts
      - name: Focused API security, device trust and truth regression
        run: pnpm --filter @lazy-armor/api test -- test/rc1-safe-logging.spec.ts test/password-reset-delivery.spec.ts test/app-role.spec.ts test/prepare-app-role.spec.ts test/p5-migration-breakpoints.spec.ts test/p5-trusted-devices.spec.ts test/p5-device-app-catalog.spec.ts test/p5-mobile-notification-receipts.spec.ts test/p5-truth-store.spec.ts test/p5-truth-store-source-resolver.spec.ts
      - name: Admin original session and role integration regression
        run: pnpm --filter @lazy-armor/api test -- test/admin-session.integration.spec.ts
      - name: Dependency image and document API integration regression
        run: pnpm --filter @lazy-armor/api test -- test/consumer-surfaces.integration.spec.ts test/share-external-reference.integration.spec.ts test/artifacts.integration.spec.ts
      - name: Focused P4/P5 regression
        run: pnpm --filter @lazy-armor/api test -- test/p4-consumer-journeys.integration.spec.ts test/p5-membership-entitlement.integration.spec.ts test/p5-usage-metering.integration.spec.ts test/p5-subscription-billing-sandbox.integration.spec.ts test/p5-template-lifecycle.integration.spec.ts test/p5-connector-contract.spec.ts test/p5-cost-foundation.integration.spec.ts test/p5-scale-foundation.integration.spec.ts test/p5-scale-multi-worker.integration.spec.ts
      - name: Upload MySQL 8.4 migration evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mysql84-migration-evidence-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/rc-evidence/mysql84-migration-evidence.json

  full-rc-gate:
    name: RC Full Gate
    needs: fast-gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/'))
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/lazy_armor_ci_test
      MYSQL_ADMIN_URL: mysql://root:root@127.0.0.1:3306/mysql
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: test-jwt-secret-that-is-longer-than-thirty-two-characters
      CREDENTIAL_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_ENV: development
      NODE_ENV: test
      APP_ROLE: api
      EXPO_PUBLIC_APP_ENV: development

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repository hygiene
        run: pnpm repository:hygiene
      - name: Current terminology gate
        run: pnpm terminology:check
      - name: Production data truth gate
        run: pnpm data:truth
      - name: Production dependency audit
        run: pnpm audit:dependencies
      - name: Prepare CI database
        run: pnpm --filter @lazy-armor/database prepare-ci-db
      - name: MySQL 8.4 migration and backup/restore evidence
        run: pnpm db:rc-integration
      - name: Full monorepo test suite including real database concurrency
        run: RUN_REAL_DB_INTEGRATION=1 pnpm test
      - name: Full monorepo build
        run: pnpm build

  android-verification:
    name: Android Verification Artifact
    needs: fast-gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.12.0
      # The verification script uses and removes a per-run external pnpm store.
      # Do not register setup-node cache for this disposable Windows job: its post-job
      # cache save otherwise fails path validation after a successful AAB upload.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug-signed Android verification artifact
        shell: pwsh
        run: ./scripts/android-verification-build.ps1
      - name: Upload Android verification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-verification-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/android/*.aab
            artifacts/android/build-artifact-metadata.json
