name: lazy-armor-p0

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lazy_armor
      MYSQL_USER: lazy_armor
      MYSQL_PASSWORD: lazy_armor_dev
      MYSQL_ROOT_PASSWORD: local_root_only
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --log-bin-trust-function-creators=1
    ports:
      - "3307:3306"
    volumes:
      - lazy_armor_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ulazy_armor", "-plazy_armor_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - lazy_armor_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  lazy_armor_mysql:
  lazy_armor_redis:
