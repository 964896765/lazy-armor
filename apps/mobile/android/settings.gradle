pluginManagement {
  def reactNativeGradlePlugin = new File(rootDir,
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require('path').relative(require('fs').realpathSync(process.cwd()), require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] }))")
    }.standardOutput.asText.get().trim()
  ).getAbsoluteFile().getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoAutolinkingPackage = new File(rootDir, providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require('path').relative(require('fs').realpathSync(process.cwd()), require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] }))")
    }.standardOutput.asText.get().trim())
  def expoPluginsPath = new File(expoAutolinkingPackage, "../android/expo-gradle-plugin").absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = '懒人装甲'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
